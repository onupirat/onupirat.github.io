<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onupirat</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23423375'/><circle cx='50' cy='50' r='25' fill='%23482490'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: rgb(0, 0, 0);
            --bg-gradient: radial-gradient(circle 850px at 30% -30%, #423375, rgb(6, 6, 6));
            --text-color: white;
            --text-muted: rgba(182, 182, 182, 0.7);
            --text-muted-light: rgba(182, 182, 182, 0.5);
            --btn-bg: rgba(66, 51, 117, 0.2);
            --btn-border: rgba(66, 51, 117, 0.3);
            --btn-hover-bg: rgba(66, 51, 117, 0.4);
            --btn-hover-border: rgba(72, 36, 144, 0.5);
            --modal-bg: rgb(15, 15, 15);
            --dropdown-bg: rgba(15, 15, 15, 0.95);
        }

        /* Base styles */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: var(--text-color);
            text-transform: uppercase;
            font-size: 40px;
            letter-spacing: 1px;
            overflow: hidden;
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            background-size: cover;
            position: relative;
        }

        /* Main content container */
        .main-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .main-content .site-logo {
            width: 100% !important;
            height: auto;
            margin-bottom: 10px;
            animation: float 6s ease-in-out infinite, glow 3s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px rgba(66, 51, 117, 0.3));
            transition: transform 0.3s ease;
        }

        .main-content .site-logo:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 30px rgba(66, 51, 117, 0.6));
        }

        /* Logo animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes glow {
            0% { filter: drop-shadow(0 0 20px rgba(66, 51, 117, 0.3)); }
            50% { filter: drop-shadow(0 0 25px rgba(72, 36, 144, 0.5)); }
            100% { filter: drop-shadow(0 0 30px rgba(66, 51, 117, 0.7)); }
        }

        /* Button styles */
        .action-buttons {
            position: absolute;
            bottom: 44px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            text-decoration: none;
            border-radius: 15px;
            transition: all 0.3s ease;
            color: var(--text-muted);
            font: 300 12px 'Space Grotesk', sans-serif;
            letter-spacing: 0.5px;
        }

        .action-button:hover {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
            color: var(--text-color);
            box-shadow: 0 0 10px rgba(72, 36, 144, 0.3);
        }

        .action-button img {
            max-height: 14px;
            width: auto;
        }

        .text-button {
            color: var(--text-muted);
            font: 300 12px 'Space Grotesk', sans-serif;
            letter-spacing: 0.5px;
        }

        /* Animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 100%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 0%; }
            100% { background-position: 0% 50%; }
        }

        /* Notification */
        .clipboard-notification {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--btn-hover-bg);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 15px;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            font: 300 12px 'Space Grotesk', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border: 1px solid var(--btn-border);
            opacity: 0;
        }

        .clipboard-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--modal-bg);
            border: 2px solid var(--btn-border);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(72, 36, 144, 0.3);
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
        }

        .close-button {
            color: var(--text-muted);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.3s;
        }

        .close-button:hover {
            color: var(--text-color);
        }

        /* IP Display */
        .ip-display {
            position: fixed;
            top: 20px;
            right: 20px;
            font: 300 12px 'Space Grotesk', sans-serif;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: none;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 15px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            transition: all 0.3s ease;
        }

        .ip-display:hover {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
            color: var(--text-color);
            box-shadow: 0 0 10px rgba(72, 36, 144, 0.3);
        }

        .ip-display .ip-label {
            color: var(--text-muted-light);
            margin-right: 6px;
        }

        /* Dropdown Menu */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 8px;
            background: var(--dropdown-bg);
            border: 1px solid var(--btn-border);
            border-radius: 12px;
            padding: 6px;
            min-width: 140px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            display: block;
            padding: 6px 12px;
            color: var(--text-muted);
            font: 300 11px 'Space Grotesk', sans-serif;
            letter-spacing: 0.5px;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .dropdown-item:hover {
            background: var(--btn-hover-bg);
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="ip-display" id="ipDisplay" title="Click to copy">
        <span class="ip-label">IP:</span><span id="ipAddress">loading...</span>
    </div>

    <div class="main-content">
        <img src="logo.svg" alt="Logo" class="site-logo">
    </div>

    <div class="action-buttons">
        <a href="https://mega.nz/folder/ooFzBKha#VKr9Kdu_s9kMADI6UtB1TA" class="action-button">
            <div style="display: flex; align-items: center; gap: 5px;">
                <img src="mega-logo2.png" alt="Mega.nz Logo" style="max-height: 16px;" />
                <span class="text-button">MEGA</span>
            </div>
        </a>
        <a href="software.html" class="action-button text-button">Software</a>
        <a href="settings.html" class="action-button text-button">Settings</a>
        <a href="wiki.html" class="action-button text-button">Wiki</a>
        <div class="dropdown">
            <a href="#" class="action-button text-button" id="commandsButton">Commands</a>
            <div class="dropdown-menu" id="commandsMenu">
                <span class="dropdown-item" data-cmd="mas">MAS</span>
                <span class="dropdown-item" data-cmd="chris">Chris</span>
                <span class="dropdown-item" data-cmd="malware">NOTMALWARE</span>
                <span class="dropdown-item" data-cmd="win11">Win11Debloat</span>
            </div>
        </div>
        <a href="https://online.winscript.cc/" class="action-button text-button" target="_blank">WinScript</a>
        <a href="https://www.moldtelecom.md/ru/speedtest/" class="action-button text-button" target="_blank">SPEEDTEST</a>
    </div>

    <div id="notification" class="clipboard-notification">command copied</div>


    <script>
        // Define the copy commands
        const copyCommands = {
            mas: 'irm https://get.activated.win | iex',
            chris: 'iwr -useb https://christitus.com/win | iex',
            malware: 'powershell -command "irm https://raw.githubusercontent.com/ImMALWARE/MalwTool/main/MalwTool.ps1 | iex"',
            win11: 'irm https://raw.githubusercontent.com/Raphire/Win11Debloat/refs/heads/master/Get.ps1 | iex'
        };

        // Function to copy text and show notification
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text)
                .then(() => showNotification())
                .catch(error => console.error('Error copying text: ', error));
        }

        // Function to show notification
        function showNotification() {
            const notification = document.getElementById('notification');
            notification.style.display = 'block';
            
            // Trigger animation
            setTimeout(() => {
                notification.classList.add('show');
            }, 10);

            // Hide notification after 2 seconds
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 400);
            }, 2000);
        }

        // Commands dropdown
        const commandsButton = document.getElementById('commandsButton');
        const commandsMenu = document.getElementById('commandsMenu');

        commandsButton.addEventListener('click', function(event) {
            event.preventDefault();
            commandsMenu.classList.toggle('show');
        });

        document.querySelectorAll('.dropdown-item[data-cmd]').forEach(item => {
            item.addEventListener('click', function() {
                const cmd = copyCommands[this.dataset.cmd];
                if (cmd) {
                    copyToClipboard(cmd);
                    commandsMenu.classList.remove('show');
                }
            });
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.dropdown')) {
                commandsMenu.classList.remove('show');
            }
        });

        // Fetch and display IP address
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ipAddress').textContent = data.ip;
            })
            .catch(() => {
                document.getElementById('ipAddress').textContent = 'unavailable';
            });

        // Copy IP on click
        document.getElementById('ipDisplay').addEventListener('click', function() {
            const ip = document.getElementById('ipAddress').textContent;
            if (ip && ip !== 'loading...' && ip !== 'unavailable') {
                navigator.clipboard.writeText(ip)
                    .then(() => {
                        const notification = document.getElementById('notification');
                        notification.textContent = 'ip copied';
                        showNotification();
                        setTimeout(() => {
                            notification.textContent = 'command copied';
                        }, 2500);
                    });
            }
        });

    </script>
</body>
</html>
